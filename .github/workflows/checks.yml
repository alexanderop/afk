name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Hook tests + shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Hook tests (zero-token)
        run: tests/hooks/run-hook-tests.sh
      - name: Shellcheck
        run: find hooks tests -name '*.sh' -print0 | xargs -0 shellcheck -x -P SCRIPTDIR
