name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Bun static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false # don't leave the git token on disk
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Static checks (zero-token)
        run: bun run test

  # One cheap headless turn (~$0.01) asserting Claude Code actually loads the
  # plugin — catches manifest/frontmatter/hook-wiring breakage the static lint
  # can't see. Skips cleanly when the secret isn't configured (e.g. forks).
  plugin-load:
    name: Plugin-load smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false # don't leave the git token on disk
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        if: env.ANTHROPIC_API_KEY != ''
        run: bun install --frozen-lockfile
      - name: Install Claude Code CLI
        if: env.ANTHROPIC_API_KEY != ''
        run: bun install --global @anthropic-ai/claude-code
      - name: Plugin loads with no plugin_errors
        if: env.ANTHROPIC_API_KEY != ''
        run: bun run test:e2e
      - name: Skipped (ANTHROPIC_API_KEY secret not configured)
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "no ANTHROPIC_API_KEY secret — smoke test skipped"
